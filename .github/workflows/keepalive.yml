name: Keep Render Apps Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping URLs
        run: |
          urls=(
            "https://aurelia-zken.onrender.com"
            "https://hostel-management-xx13.onrender.com/"
          )

          for url in "${urls[@]}"; do
            echo "========================================"
            echo "Pinging: $url"
            date
            curl -L -s -o /dev/null -w "Status: %{http_code} | Time: %{time_total}s\n" "$url"
          done
