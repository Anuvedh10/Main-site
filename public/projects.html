<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Aurelia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="projects.css" />
</head>
<body>
  <!-- Animated background layer (shared with login/dashboard) -->
  <div class="bg-scene" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>
    <div class="grain"></div>
  </div>
  <!-- Navigation bar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-brand">
        <div class="logo-mark logo-mark-sm">
          <svg viewBox="0 0 48 48" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 4L44 15V33L24 44L4 33V15L24 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M24 4V44" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
            <circle cx="24" cy="24" r="6" fill="currentColor"/>
          </svg>
        </div>
        <span class="nav-title">Aurelia</span>
      </div>
      <div class="nav-links">
        <a href="dashboard.html" class="nav-link">Overview</a>
        <a href="projects.html" class="nav-link active">Projects</a>
        <a href="#" class="nav-link">Reports</a>
        <a href="settings.html" class="nav-link">Settings</a>
      </div>
      <div class="nav-actions">
        <span class="nav-user" id="navUser">Hi, Admin</span>
        <button class="btn-logout" id="logoutBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </nav>
  <!-- Main projects content -->
  <main class="dash-main">
    <header class="dash-header projects-header">
      <div>
        <h1 class="dash-welcome">Projects</h1>
        <p class="dash-subtitle">Everything you've added from Settings, in one place.</p>
      </div>
    </header>
    <!-- Populated by projects.js -->
    <section class="project-grid" id="projectGrid"></section>
    <!-- Empty state -->
    <div class="glass-card empty-state" id="projectsEmptyState">
      <div class="empty-state-icon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 9H21" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 14H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>No projects yet</h2>
      <p>Add your first project from Settings and it will show up here automatically.</p>
      <a href="settings.html" class="btn-save" data-admin-only>Go to Settings</a>
    </div>
  </main>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script src="projects.js"></script>
</body>
</html>
