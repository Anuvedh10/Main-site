<!DOCTYPE html>
<html lang="en">
<head>
    <img src="logo.png" alt="Logo" class="logo">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | CodeVault</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated background layer -->
  <div class="bg-scene" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>
    <div class="grain"></div>
  </div>

  <!-- Main content -->
  <main class="stage">
    <section class="login-card" role="form" aria-labelledby="welcomeHeading">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-mark">
          <svg viewBox="0 0 48 48" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 4L44 15V33L24 44L4 33V15L24 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M24 4V44" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
            <circle cx="24" cy="24" r="6" fill="currentColor"/>
          </svg>
        </div>
      </div>

      <h1 id="welcomeHeading" class="title">Create Account</h1>
      <p class="subtitle">Sign up for a read-only Aurelia account</p>

      <form id="signupForm" novalidate>

        <!-- Full name -->
        <div class="field">
          <label for="fullName" class="field-label">Full name</label>
          <div class="input-shell" data-field="fullName">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12C14.4853 12 16.5 9.98528 16.5 7.5C16.5 5.01472 14.4853 3 12 3C9.51472 3 7.5 5.01472 7.5 7.5C7.5 9.98528 9.51472 12 12 12Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 20C4 16.134 7.58172 13 12 13C16.4183 13 20 16.134 20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Username -->
        <div class="field">
          <label for="newUsername" class="field-label">Username</label>
          <div class="input-shell" data-field="newUsername">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 20C4 16.134 7.58172 13 12 13C16.4183 13 20 16.134 20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              type="text"
              id="newUsername"
              name="newUsername"
              placeholder="Choose a username"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="newPassword" class="field-label">Password</label>
          <div class="input-shell" data-field="newPassword">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 10.5V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10.5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
            </svg>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Choose a password"
              autocomplete="new-password"
            />
          </div>
        </div>

        <!-- Confirm password -->
        <div class="field">
          <label for="confirmPassword" class="field-label">Confirm password</label>
          <div class="input-shell" data-field="confirmPassword">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 10.5V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10.5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
            </svg>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
            />
          </div>
        </div>

        <!-- Info note -->
        <p class="signup-note">
          New accounts get read-only dashboard access. Admin access is granted separately.
        </p>

        <!-- Error message -->
        <div class="error-message" id="errorMessage" role="alert" aria-live="assertive" style="display:none;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 8V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="16" r="0.9" fill="currentColor"/>
          </svg>
          <span id="errorText">Something went wrong.</span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-signin" id="signUpBtn">
          <span class="btn-label">Create Account</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

        <p class="signup-prompt">
          Already have an account?
          <a href="index.html">Sign in</a>
        </p>

      </form>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="signup.js"></script>
</body>
</html>
