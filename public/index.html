<!DOCTYPE html>
<html lang="en">
<head>
    <img src="logo.png" alt="Logo" class="logo">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In CodeVault</title>

  <!-- Fonts: Poppins for display, Inter for body/UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated background layer -->
  <div class="bg-scene" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>
    <div class="grain"></div>
  </div>

  <!-- Main content -->
  <main class="stage">
    <section class="login-card" role="form" aria-labelledby="welcomeHeading">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-mark">
          <svg viewBox="0 0 48 48" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 4L44 15V33L24 44L4 33V15L24 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M24 4V44" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
            <circle cx="24" cy="24" r="6" fill="currentColor"/>
          </svg>
        </div>
      </div>

      <h1 id="welcomeHeading" class="title">Welcome Back</h1>
      <p class="subtitle">Sign in to continue to CodeVault</p>

      <form id="loginForm" novalidate>

        <!-- Username field -->
        <div class="field">
          <label for="username" class="field-label">Username</label>
          <div class="input-shell" data-field="username">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12C14.4853 12 16.5 9.98528 16.5 7.5C16.5 5.01472 14.4853 3 12 3C9.51472 3 7.5 5.01472 7.5 7.5C7.5 9.98528 9.51472 12 12 12Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 20C4 16.134 7.58172 13 12 13C16.4183 13 20 16.134 20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>
        </div>

        <!-- Password field -->
        <div class="field">
          <label for="password" class="field-label">Password</label>
          <div class="input-shell" data-field="password">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 10.5V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10.5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.5 12C2.5 12 6 5.5 12 5.5C18 5.5 21.5 12 21.5 12C21.5 12 18 18.5 12 18.5C6 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10.6 5.7C11.05 5.6 11.51 5.55 12 5.55C18 5.55 21.5 12 21.5 12C21.5 12 20.4 14.1 18.3 15.85M6.9 6.9C4.5 8.35 2.5 12 2.5 12C2.5 12 6 18.45 12 18.45C13.75 18.45 15.25 17.95 16.5 17.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.8 13.6C9.5 13.15 9.35 12.6 9.35 12C9.35 10.4 10.65 9.1 12.25 9.1C12.85 9.1 13.4 9.3 13.85 9.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember / Forgot row -->
        <div class="row-between">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span class="checkbox-box" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="11" height="11" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 8.5L6.2 11.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox-label">Remember me</span>
          </label>

          <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
        </div>

        <!-- Error message -->
        <div class="error-message" id="errorMessage" role="alert" aria-live="assertive" style="display:none;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 8V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="16" r="0.9" fill="currentColor"/>
          </svg>
          <span id="errorText">Invalid username or password.</span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-signin" id="signInBtn">
          <span class="btn-label">Sign In</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

        <!-- Create account -->
        <p class="signup-prompt">
          Don't have an account?
          <a href="signup.html" id="createAccountLink">Create one</a>
        </p>

      </form>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
