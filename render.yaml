databases:
  - name: aurelia-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: aurelia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurelia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_GUEST_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
